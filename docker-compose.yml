# Local DEVELOPMENT infrastructure for Orbs. Default passwords are for localhost only;
# override them through environment variables (or a git-ignored .env) on any shared machine.
#   docker compose up -d            -> Postgres only
#   docker compose --profile storage up -d   -> + MinIO (S3-compatible)
#   docker compose --profile local-ai up -d  -> + Ollama (local models)
name: orbs

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbs}
      POSTGRES_DB: orbs
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbs -d orbs"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orbs
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orbs-local-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  minio-data:
  ollama-data:
